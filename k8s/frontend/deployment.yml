apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: linkscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkscope-frontend
  template:
    metadata:
      labels:
        app: linkscope-frontend
    spec:
      containers:
        - name: frontend
          image: linkscope-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
