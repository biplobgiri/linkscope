apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: linkscope
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkscope-app
  template:
    metadata:
      labels:
        app: linkscope-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: ghcr.io/biplobgiri/linkscope:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
