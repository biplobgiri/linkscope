---
- name: Deploy LinkScope
  hosts: linkscope
  become: true

  vars:
    app_dir: /home/biplobgiri/devopsLab/linkscope
    registry: ghcr.io/biplobgiri/linkscope

  tasks:
    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Log in to GitHub container registry
      command: >
        docker login ghcr.io
        -u {{ lookup('env', 'GITHUB_ACTOR') }}
        -p {{ lookup('env', 'GITHUB_TOKEN') }}

    - name: Pull latest image
      command: docker pull {{ registry }}:latest

    - name: Deploy with docker compose
      command: docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for app to be ready
      pause:
        seconds: 10

    - name: Run DB migrations
      command: docker compose exec -T app alembic upgrade head
      args:
        chdir: "{{ app_dir }}"

    - name: Health check
      uri:
        url: http://localhost:8000/health
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 5
      delay: 5

    - name: Confirm deployment
      debug:
        msg: "LinkScope is up — {{ health.json.status }}"